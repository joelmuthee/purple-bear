name = "purplebear-api"
main = "src/index.js"
compatibility_date = "2025-01-01"
account_id = "58685495706b973821d77208248c66fc"

[[kv_namespaces]]
binding = "BAGS"
id = "7c49bd72e6994c46b72a442eb221b141"

# Workers AI — Llama 3.1 8B (text) + Llama 3.2 11B Vision for IG bulk-sync
# classification. Free tier: 10k requests/day, comfortable for daily syncs.
[ai]
binding = "AI"

# Crons, dispatched by event.cron in scheduled():
#   "0 17 * * *"  → 20:00 EAT: daily WhatsApp report (no-ops unless owner enabled it)
#
# NO IG auto-sync crons (Joel, 2026-09-09). Instagram now requires login, so
# every pull goes through Apify, which bills per post FETCHED rather than per
# new post found. Polling 3x a day costs about Ksh 420 a shop a month for
# posts that are usually unchanged. So sync is manual-button only, and since
# 2026-10-07 the button fetches only posts newer than the shop has already
# seen: a tap with nothing new costs $0, new posts ~Ksh 0.30 each, max 2
# checks a day (see CATALOG-STANDARDS.md). /api/autosync-run still exists.
[triggers]
crons = ["0 17 * * *"]

# Secrets — never committed:
#   npx wrangler secret put ADMIN_TOKEN
#   npx wrangler secret put WASENDER_TOKEN   (for the daily WhatsApp report)
