name = "purplebear-api"
main = "src/index.js"
compatibility_date = "2025-01-01"
account_id = "58685495706b973821d77208248c66fc"

[[kv_namespaces]]
binding = "BAGS"
id = "7c49bd72e6994c46b72a442eb221b141"

# Workers AI — Llama 3.1 8B (text) + Llama 3.2 11B Vision for IG bulk-sync
# classification. Free tier: 10k requests/day, comfortable for daily syncs.
[ai]
binding = "AI"

# Crons, dispatched by event.cron in scheduled():
#   "10 6 * * *"  →  9:10 EAT: IG auto-sync, morning wave (owner ask 2026-06-17:
#                   thrice a day — morning + afternoon + evening)
#   "10 10 * * *" → 13:10 EAT: IG auto-sync, afternoon wave (Ryker's stagger
#                   offset is :10; Iman holds :00 [disabled], ThriftLux :20)
#   "10 16 * * *" → 19:10 EAT: IG auto-sync, evening wave
#   "0 17 * * *"  → 20:00 EAT: daily WhatsApp report (no-ops unless owner enabled it)
[triggers]
# IG auto-sync DISABLED at owner request (manual upload only) — the three IG
# waves (10 6, 10 10, 10 16) were removed. Only the daily WhatsApp report cron
# remains. To re-enable IG: restore those three crons and set
# IG_AUTOSYNC_USER_ID back to the account id.
crons = ["0 17 * * *"]

# Secrets — never committed:
#   npx wrangler secret put ADMIN_TOKEN
#   npx wrangler secret put WASENDER_TOKEN   (for the daily WhatsApp report)
