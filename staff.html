<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Purple Bear · Staff sign in</title>
<link rel="icon" type="image/jpeg" sizes="192x192" href="images/favicon-192.jpg">
<link rel="apple-touch-icon" sizes="180x180" href="images/logo.jpg">
<meta name="theme-color" content="#5b2a86">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=20260706staff">
</head>
<body style="background:var(--bg);">

<div class="login-wrap">
  <h1>Purple Bear</h1>
  <p>Staff sign in — enter your staff password to start selling</p>
  <div class="field">
    <label>Staff password</label>
    <input id="staffPw" type="password" autocomplete="current-password">
  </div>
  <button class="btn-admin primary" id="staffLoginBtn" style="width:100%">Sign in</button>
  <p id="staffErr" style="color:#b00020;font-size:13px;text-align:center;margin-top:12px;display:none;">Wrong password</p>
</div>

<script>
  // Staff sign-in — same worker check as the owner admin, then hand off to
  // admin.html which reads the saved role and shows the limited (assistant) view.
  const API_BASE = 'https://purplebear-api.stawisystems.workers.dev';
  const pwEl = document.getElementById('staffPw');
  const errEl = document.getElementById('staffErr');
  const btn = document.getElementById('staffLoginBtn');
  async function go() {
    const pw = pwEl.value;
    errEl.style.display = 'none';
    if (!pw) return;
    btn.disabled = true;
    try {
      const res = await fetch(`${API_BASE}/api/check-password`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pw })
      });
      const j = await res.json();
      if (j.ok) {
        sessionStorage.setItem('purplebear_auth', '1');
        sessionStorage.setItem('purplebear_role', j.source === 'assistant' ? 'assistant' : 'owner');
        location.href = 'admin.html';
      } else {
        errEl.textContent = 'Wrong password';
        errEl.style.display = 'block';
        btn.disabled = false;
      }
    } catch (e) {
      errEl.textContent = 'Network error, try again.';
      errEl.style.display = 'block';
      btn.disabled = false;
    }
  }
  btn.addEventListener('click', go);
  pwEl.addEventListener('keypress', e => { if (e.key === 'Enter') go(); });
</script>
</body>
</html>
